name: Non-payment QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonpayment-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Non-payment integration and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-disposable-only
          POSTGRES_DB: talenthunt_qa_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talenthunt_qa_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:qa-disposable-only@127.0.0.1:5432/talenthunt_qa_admin
      QA_TEST_DATABASE_URL: postgresql://postgres:qa-disposable-only@127.0.0.1:5432/talenthunt_qa_admin
      QA_DISPOSABLE_DATABASES: "1"
      PAYSTACK_MODE: ""
      PAYSTACK_SECRET_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium test dependencies
        run: npm exec --workspace apps/web -- playwright install --with-deps chromium
      - name: Run the complete non-payment gate
        run: npm run qa:nonpayment
      - name: Record dependency advisories
        if: always()
        # Runtime fixes are regression-tested above. Remaining Prisma/lint
        # tooling findings need separate compatibility review, not audit fix --force.
        continue-on-error: true
        run: |
          mkdir -p artifacts/qa
          npm audit --json > artifacts/qa/dependency-audit.json
      - name: Retain QA diagnostics and browser failure traces
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nonpayment-qa-${{ github.run_id }}
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 7
